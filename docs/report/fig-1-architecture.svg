<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="100%" role="img" aria-label="Q-Shield proof-of-concept architecture"><defs><marker id="ujung" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6270"/></marker></defs><rect width="900" height="545" fill="#fff"/><rect x="20" y="26" width="240" height="62" rx="4" fill="#f4f6f8" stroke="#c9d0da" stroke-width="1"/><text x="32" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">CLIENT</text><text x="32" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Native SDK  ·  on-device TLV pre-parse,</text><text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">non-EMVCo rejected locally, attestation</text><text x="32" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Web scanner  ·  verify / catalogue mode</text><rect x="300" y="26" width="190" height="62" rx="4" fill="#f4f6f8" stroke="#c9d0da" stroke-width="1"/><text x="312" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">PJP BACKEND</text><text x="312" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">attaches API key</text><text x="312" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b6270">owns the payment path</text><text x="312" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b6270">enforces the verdict</text><rect x="530" y="26" width="350" height="62" rx="4" fill="#fff" stroke="#c9d0da" stroke-width="1"/><text x="542" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">Q-SHIELD API BOUNDARY</text><text x="542" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">API key auth  ·  per-client rate limit</text><text x="542" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">body-size cap  ·  security headers</text><text x="542" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">audit trail, no PII</text><line x1="262" y1="57" x2="298" y2="57" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><line x1="492" y1="57" x2="528" y2="57" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><rect x="20" y="110" width="860" height="66" rx="4" fill="#fff" stroke="#c9d0da" stroke-width="1" stroke-dasharray="4 3"/><text x="32" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">FOUR PRE-SCORING GATES   —   three of them stop Layer 1 from running at all</text><rect x="26" y="132" width="206" height="38" rx="3" fill="#fff" stroke="#b91c1c" stroke-width="1.2"/><text x="34" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#b91c1c" font-weight="600">1  unparseable / no NMID</text><text x="34" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">422 — stop.</text><text x="34" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270">nothing learned</text><rect x="238" y="132" width="206" height="38" rx="3" fill="#fff" stroke="#c2410c" stroke-width="1.2"/><text x="246" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#c2410c" font-weight="600">2  mock_location: true</text><text x="246" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">Layer 1 skipped</text><text x="246" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270">location risk 65</text><rect x="450" y="132" width="206" height="38" rx="3" fill="#fff" stroke="#b45309" stroke-width="1.2"/><text x="458" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#b45309" font-weight="600">3  from_image: true</text><text x="458" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">Layer 1 skipped</text><text x="458" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270">location risk 0</text><rect x="662" y="132" width="206" height="38" rx="3" fill="#fff" stroke="#b45309" stroke-width="1.2"/><text x="670" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#b45309" font-weight="600">4  accuracy &gt; 100 m</text><text x="670" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">Layer 1 skipped</text><text x="670" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270">location risk 40</text><text x="450" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b6270" text-anchor="middle">scan payload  +  lat / lng  +  accuracy  +  anonymous device id</text><line x1="450" y1="88" x2="450" y2="106" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><rect x="20" y="196" width="424" height="150" rx="4" fill="#fbfcfe" stroke="#1d4ed8" stroke-width="1.3"/><text x="34" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">LAYER 1 — MERCHANT-LOCATION BINDING</text><text x="34" y="229" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Is this NMID established at these coordinates?</text><text x="34" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">anchor = same NMID within 50 m, by distance</text><text x="34" y="261" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">established at 3 distinct devices over 24 h</text><text x="34" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">bounded running average — 6.9 m → 1.4 m at 47 obs</text><text x="34" y="303" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8">four exemptions, each empirically calibrated:</text><text x="34" y="317" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8">adjacent  ·  relocated  ·  roving  ·  alternating</text><text x="34" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" font-style="italic">skipped entirely by gates 2–4</text><rect x="456" y="196" width="424" height="150" rx="4" fill="#fbfcfe" stroke="#1d4ed8" stroke-width="1.3"/><text x="470" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">LAYER 2 — ARTIFACT &amp; BEHAVIOURAL SCORING</text><text x="470" y="229" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Does this payload behave like a legitimate artefact?</text><text x="470" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· structural contradictions</text><text x="680" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· device integrity</text><text x="470" y="261" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· dynamic-QR trail</text><text x="680" y="261" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· provenance / area city</text><text x="470" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· printed label vs code</text><text x="680" y="275" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· merchant-profile rarity</text><text x="470" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· ambient WiFi fingerprint</text><text x="680" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d">· issuer dialect</text><text x="470" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8">two unsupervised models, zero fraud labels</text><text x="470" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" font-style="italic">runs in full even when Layer 1 is skipped</text><line x1="232" y1="176" x2="232" y2="192" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><line x1="668" y1="176" x2="668" y2="192" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><rect x="250" y="366" width="400" height="42" rx="4" fill="#f4f6f8" stroke="#16181d" stroke-width="1.2"/><text x="450" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#16181d" font-weight="600" text-anchor="middle">COMPOSE</text><text x="450" y="399" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5b6270" text-anchor="middle">scores add, clamp 0–100  ·  Layer 2 may only lower trust  ·  reasons re-sorted by weight</text><path d="M232,346 L232,356 L350,356 L350,364" fill="none" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><path d="M668,346 L668,356 L550,356 L550,364" fill="none" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><rect x="20" y="432" width="424" height="92" rx="4" fill="#fff" stroke="#c9d0da" stroke-width="1"/><text x="34" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">RESPONSE</text><text x="34" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">verdict  ·  action  ·  risk_score  ·  layer breakdown</text><text x="34" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">human-readable reasons  ·  evidence provenance</text><text x="34" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#1d4ed8" font-weight="600">HMAC-SHA256 ticket, 90 s</text><text x="34" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270">binds the verdict to this exact payload digest</text><rect x="456" y="432" width="424" height="92" rx="4" fill="#fff" stroke="#c9d0da" stroke-width="1"/><text x="470" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">PERSISTENCE  —  SQLite WAL, zero-PII</text><text x="470" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">bindings · observations · challenge ledger · anchors</text><text x="470" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">issuer dialects · feature corpus · AP fingerprints</text><text x="470" y="497" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8" fill="#16181d">device_ref = sha256(salt ‖ binding_id ‖ device id)</text><text x="470" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270">scoped per anchor — cannot be chained across places</text><line x1="232" y1="408" x2="232" y2="428" stroke="#5b6270" stroke-width="1.4" marker-end="url(#ujung)"/><path d="M650,397 L862,397 L862,428" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ujung)" stroke-dasharray="4 3"/><text x="856" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1d4ed8" text-anchor="end">learn — only when the verdict is not anomaly</text><text x="856" y="377" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" text-anchor="end">payload knowledge only for image and replay</text></svg>