<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="100%" role="img" aria-label="Q-Shield friction gates and tier mapping"><defs><marker id="ujung" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6270"/></marker></defs><rect width="900" height="452" fill="#fff"/><text x="20" y="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="600">FRICTION GATES — FROM SCORE TO WHAT THE APP DOES</text><text x="20" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">One 0–100 score, four tiers, and one rule that cannot be bypassed: a verdict of “unknown” never maps to proceed.</text><rect x="20.0" y="66" width="215.0" height="30" fill="#15803d" opacity="0.13"/><rect x="20.0" y="66" width="215.0" height="30" fill="none" stroke="#15803d" stroke-width="1.2"/><text x="127.5" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="middle">PROCEED</text><text x="127.5" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d" text-anchor="middle">pay normally</text><text x="127.5" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" text-anchor="middle">PIN screen opens as usual</text><rect x="235.0" y="66" width="215.0" height="30" fill="#b45309" opacity="0.13"/><rect x="235.0" y="66" width="215.0" height="30" fill="none" stroke="#b45309" stroke-width="1.2"/><text x="342.5" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="600" text-anchor="middle">WARN</text><text x="342.5" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d" text-anchor="middle">allow, but show the reasons</text><text x="342.5" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" text-anchor="middle">reasons shown above the PIN pad</text><rect x="450.0" y="66" width="215.0" height="30" fill="#c2410c" opacity="0.13"/><rect x="450.0" y="66" width="215.0" height="30" fill="none" stroke="#c2410c" stroke-width="1.2"/><text x="557.5" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#c2410c" font-weight="600" text-anchor="middle">STEP_UP</text><text x="557.5" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d" text-anchor="middle">require additional verification</text><text x="557.5" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" text-anchor="middle">confirmation required before PIN</text><rect x="665.0" y="66" width="215.0" height="30" fill="#b91c1c" opacity="0.13"/><rect x="665.0" y="66" width="215.0" height="30" fill="none" stroke="#b91c1c" stroke-width="1.2"/><text x="772.5" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#b91c1c" font-weight="600" text-anchor="middle">COOLING_OFF</text><text x="772.5" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#16181d" text-anchor="middle">hold — do not pay</text><text x="772.5" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#5b6270" text-anchor="middle">PIN screen never rendered; 30 s countdown</text><text x="20.0" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5b6270" text-anchor="middle">0</text><text x="235.0" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5b6270" text-anchor="middle">25</text><text x="450.0" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5b6270" text-anchor="middle">50</text><text x="665.0" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5b6270" text-anchor="middle">75</text><text x="880.0" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5b6270" text-anchor="middle">100</text><rect x="20" y="148" width="424" height="76" rx="4" fill="#fbfcfe" stroke="#1d4ed8" stroke-width="1.2"/><text x="34" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">THE FLOOR RULE   (invariant §2)</text><text x="34" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">A young binding can score 15 — inside the proceed band.</text><text x="34" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Its verdict is unknown, so the action is floored to warn.</text><text x="34" y="213" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8">Absence of evidence is never converted into trust.</text><rect x="456" y="148" width="424" height="76" rx="4" fill="#fbfcfe" stroke="#1d4ed8" stroke-width="1.2"/><text x="470" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8" font-weight="600">THE COMPOSITION RULE</text><text x="470" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Layer 2 holds no negative weight at all. A hard</text><text x="470" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">contradiction forces anomaly; any other signal demotes</text><text x="470" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">verified to unknown. An anomaly is never withdrawn.</text><text x="20" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#1d4ed8" font-weight="600">WORKED EXAMPLES — produced by running the real evaluator</text><text x="34" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1d4ed8" font-weight="600">SCAN</text><text x="470" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1d4ed8" font-weight="600">LAYER 1</text><text x="560" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1d4ed8" font-weight="600">LAYER 2</text><text x="646" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1d4ed8" font-weight="600">TOTAL</text><text x="726" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" fill="#1d4ed8" font-weight="600">VERDICT / ACTION</text><line x1="20" y1="278" x2="880" y2="278" stroke="#c9d0da" stroke-width="1"/><text x="34" y="297" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Established merchant, clean GPS</text><text x="488" y="297" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">0</text><text x="578" y="297" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">0</text><text x="660" y="297" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#16181d" font-weight="600" text-anchor="middle">0</text><text x="726" y="297" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#15803d" font-weight="600">verified / proceed</text><rect x="20" y="306" width="860" height="24" fill="#f4f6f8"/><text x="34" y="321" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Place never recorded before</text><text x="488" y="321" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">35</text><text x="578" y="321" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">0</text><text x="660" y="321" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#16181d" font-weight="600" text-anchor="middle">35</text><text x="726" y="321" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#b45309" font-weight="600">unknown / warn</text><text x="34" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">GPS accuracy 800 m — Layer 1 refuses</text><text x="488" y="345" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">40</text><text x="578" y="345" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">0</text><text x="660" y="345" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#16181d" font-weight="600" text-anchor="middle">40</text><text x="726" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#b45309" font-weight="600">unknown / warn</text><rect x="20" y="354" width="860" height="24" fill="#f4f6f8"/><text x="34" y="369" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Foreign sticker at an anchor of 6 observers</text><text x="488" y="369" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">63</text><text x="578" y="369" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">0</text><text x="660" y="369" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#16181d" font-weight="600" text-anchor="middle">63</text><text x="726" y="369" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#c2410c" font-weight="600">anomaly / step_up</text><text x="34" y="393" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#16181d">Foreign sticker at an anchor of 47 observers</text><text x="488" y="393" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">83</text><text x="578" y="393" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#5b6270" text-anchor="middle">0</text><text x="660" y="393" font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" fill="#16181d" font-weight="600" text-anchor="middle">83</text><text x="726" y="393" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#b91c1c" font-weight="600">anomaly / cooling_off</text><line x1="20" y1="402" x2="880" y2="402" stroke="#c9d0da" stroke-width="1"/><text x="20" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b6270" font-style="italic">The last two rows are the same attack on the same spot. What differs is only how much evidence the system has gathered — which is why the tier moves.</text></svg>