<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Q-Shield PoC architecture and friction gates, slide"><defs><marker id="ujung" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6270"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="60" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#16181d" font-weight="600">Proof of Concept Architecture</text><text x="60" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5b6270">Two independent layers, four gates, one verdict — all before the PIN screen</text><line x1="60" y1="140" x2="1540" y2="140" stroke="#c9d0da" stroke-width="2"/><rect x="60" y="176" width="250" height="96" rx="8" fill="#f4f6f8" stroke="#c9d0da" stroke-width="1.5"/><text x="185" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#16181d" font-weight="600" text-anchor="middle">SCAN</text><text x="185" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">payload + GPS</text><text x="185" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">+ anonymous device id</text><rect x="350" y="158" width="430" height="132" rx="8" fill="#fff" stroke="#c9d0da" stroke-width="1.5" stroke-dasharray="4 3"/><text x="365" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1d4ed8" font-weight="600">FOUR GATES</text><rect x="365" y="196" width="194" height="38" rx="5" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/><text x="375" y="213" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b91c1c" font-weight="600">unparseable</text><text x="375" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6270">stop, 422</text><rect x="567" y="196" width="194" height="38" rx="5" fill="#fff" stroke="#c2410c" stroke-width="1.6"/><text x="577" y="213" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" font-weight="600">mock GPS</text><text x="577" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6270">Layer 1 off</text><rect x="365" y="242" width="194" height="38" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.6"/><text x="375" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b45309" font-weight="600">from photo</text><text x="375" y="273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6270">Layer 1 off</text><rect x="567" y="242" width="194" height="38" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.6"/><text x="577" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#b45309" font-weight="600">GPS &gt; 100 m</text><text x="577" y="273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6270">Layer 1 off</text><rect x="820" y="158" width="400" height="62" rx="8" fill="#fbfcfe" stroke="#1d4ed8" stroke-width="2"/><text x="838" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1d4ed8" font-weight="600">LAYER 1</text><text x="838" y="207" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#16181d">Is this merchant supposed to be HERE?</text><rect x="820" y="230" width="400" height="62" rx="8" fill="#fbfcfe" stroke="#1d4ed8" stroke-width="2"/><text x="838" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1d4ed8" font-weight="600">LAYER 2</text><text x="838" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#16181d">Does this code BEHAVE legitimately?</text><rect x="1290" y="176" width="250" height="96" rx="8" fill="#f4f6f8" stroke="#16181d" stroke-width="2"/><text x="1415" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#16181d" font-weight="600" text-anchor="middle">VERDICT</text><text x="1415" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">+ signed ticket</text><text x="1415" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">bound to this code</text><line x1="312" y1="224" x2="348" y2="224" stroke="#5b6270" stroke-width="2.5" marker-end="url(#ujung)"/><line x1="782" y1="224" x2="818" y2="224" stroke="#5b6270" stroke-width="2.5" marker-end="url(#ujung)"/><line x1="1222" y1="224" x2="1288" y2="224" stroke="#5b6270" stroke-width="2.5" marker-end="url(#ujung)"/><text x="60" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#16181d">Three of the four gates stop Layer 1 entirely — and Layer 2 still runs in full.</text><text x="60" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#5b6270">Layer 2 holds no negative weight: a clean payload can never buy back trust that Layer 1 withheld.</text><line x1="60" y1="404" x2="1540" y2="404" stroke="#c9d0da" stroke-width="2"/><text x="60" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#16181d" font-weight="600">Friction Gates</text><text x="60" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5b6270">One 0–100 score, four tiers — and a verdict of “unknown” can never become “proceed”.</text><rect x="60.0" y="520" width="370.0" height="86" rx="6" fill="#15803d" opacity="0.14"/><rect x="60.0" y="520" width="370.0" height="86" rx="6" fill="none" stroke="#15803d" stroke-width="2.4"/><text x="245.0" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#15803d" font-weight="600" text-anchor="middle">PROCEED</text><text x="245.0" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#16181d" text-anchor="middle">pay normally</text><text x="60.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">0</text><rect x="430.0" y="520" width="370.0" height="86" rx="6" fill="#b45309" opacity="0.14"/><rect x="430.0" y="520" width="370.0" height="86" rx="6" fill="none" stroke="#b45309" stroke-width="2.4"/><text x="615.0" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#b45309" font-weight="600" text-anchor="middle">WARN</text><text x="615.0" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#16181d" text-anchor="middle">allow — but show why</text><text x="430.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">25</text><rect x="800.0" y="520" width="370.0" height="86" rx="6" fill="#c2410c" opacity="0.14"/><rect x="800.0" y="520" width="370.0" height="86" rx="6" fill="none" stroke="#c2410c" stroke-width="2.4"/><text x="985.0" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#c2410c" font-weight="600" text-anchor="middle">STEP_UP</text><text x="985.0" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#16181d" text-anchor="middle">verify before paying</text><text x="800.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">50</text><rect x="1170.0" y="520" width="370.0" height="86" rx="6" fill="#b91c1c" opacity="0.14"/><rect x="1170.0" y="520" width="370.0" height="86" rx="6" fill="none" stroke="#b91c1c" stroke-width="2.4"/><text x="1355.0" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#b91c1c" font-weight="600" text-anchor="middle">COOLING_OFF</text><text x="1355.0" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#16181d" text-anchor="middle">PIN screen never opens</text><text x="1170.0" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">75</text><text x="1540" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" text-anchor="middle">100</text><rect x="60" y="650" width="1480" height="132" rx="8" fill="#fff" stroke="#c9d0da" stroke-width="1.5"/><text x="84" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1d4ed8" font-weight="600">THE SAME ATTACK, TWICE</text><text x="84" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16181d">Foreign sticker at an anchor with</text><text x="430" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16181d" font-weight="600">6 observers</text><text x="566" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5b6270">→  score 63  →</text><text x="740" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#c2410c" font-weight="600">step_up</text><text x="84" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16181d">Foreign sticker at an anchor with</text><text x="430" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16181d" font-weight="600">47 observers</text><text x="566" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5b6270">→  score 83  →</text><text x="740" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#b91c1c" font-weight="600">cooling_off</text><text x="900" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#16181d">Nothing about the attack changed.</text><text x="900" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1d4ed8" font-weight="600">Only the evidence did.</text><text x="60" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6270" font-style="italic">Every number above is produced by a script in the repository, not asserted.</text></svg>